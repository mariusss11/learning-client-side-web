<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Page</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .page {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Full-bleed background image */
        .bg {
            position: absolute;
            inset: 0;
            background-image: url("images/hero.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Nav top-right */
        nav {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 48px;
            padding: 28px 52px;
            z-index: 10;
        }

        nav a {
            text-decoration: none;
            color: #111;
            font-family: 'Roboto';
            font-weight: 400;
            margin-right: 50px;
            font-size: 20px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        /* Headline bottom-right area */
        .headline {
            position: absolute;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
            z-index: 10;
        }

        .headline h1 {
            font-family: 'Roboto';
            font-weight: 900;
            font-size: 100px;
            line-height: 0.93;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            color: #111;
        }

        /* ── PRODUCTS SECTION ── */
        .products {
            width: 100%;
            padding: 80px 60px;
            /* background: #f0efed; */
        }

        .products h1 {
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #111;
            margin-bottom: 48px;
        }

        .list {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .card {
            display: flex;
            align-items: center;
            position: relative;
            gap: 30px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            margin: 20px auto;
            max-width: 900px;
            transition: transform 0.2s ease, box-shadow 0.5s ease;
        }

        .card img {
            width: 440px;
            height: 260px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
        }

        .card-info {
            padding: 30px 30px 30px 0;
        }

        .card-info img {
            width: 100%;
            max-width: 220px;
            height: 200px;
            object-fit: contain;
        }

        .card-info h2 {
            font-family: 'Montserrat';
            font-size: 28px;
            font-weight: 700;
            color: #333333;
            margin-bottom: 12px;
        }

        .card-info p {
            font-family: 'Montserrat';
            font-size: 15px;
            line-height: 1.7;
            color: #555;
        }

        .info {
            font-size: 30px;
            margin: 5px;
        }

        button {
            font-weight: 700;
            font-size: larger;
            font-family: 'Montserrat';
            bottom: 16px;
            right: 16px;
            border: none;
            color: black;
            padding: 16px 32px;
            border-radius: 10px;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-6px);
        }

        .add-product {
            position: fixed;
            font-weight: bold;
            font-size: xx-large;
        }

        .save-button {
            position: absolute;

        }
    </style>
</head>

<body>
    <div class="page">

        <nav>
            <a href="home.html">Back to home page</a>
        </nav>


        <!-- <div class="headline">
            <h1>PUT THE<br>WORLD ON<br>MUTE</h1>
        </div> -->

        <!-- PRODUCTS -->
        <div class="products">
            <h1>All Products</h1>
            <button class="add-product">Add product</button>
            <div class="list">

                <table>

                </table>

                <div class="card">
                    <img src="images/product-1.png" alt="Product One" />
                    <div class="card-info">
                        <input class="info" type="text" value="Beats Solo4">
                        <input class="info" type="number" value="225.50">
                        <select class="info" name="" id="">
                            <option value="$">USD</option>
                            <option value="$">EUR</option>
                            <option value="$">MDL</option>
                        </select>
                        <!-- <p>$225.50</p> -->
                    </div>
                    <button class="save-button">Save changes</button>
                </div>

                <div class="card">
                    <img src="images/product-2.png" alt="Product Two" />
                    <div class="card-info">
                        <h2></h2>
                        <input class="info" type="text" value="JBL Tune 520BT">
                        <input class="info" type="number" value="225.50">
                        <select class="info" name="" id="">
                            <option value="$">USD</option>
                            <option value="$">EUR</option>
                            <option value="$">MDL</option>
                        </select>
                    </div>
                    <button class="save-button">Save changes</button>
                </div>

                <div class="card">
                    <img src="images/product-3.png" alt="Product Three" />
                    <div class="card-info">
                        <input class="info" type="text" value="JLab Studio 2">
                        <input class="info" type="number" value="225.50">
                        <select class="info" name="" id="">
                            <option value="$">USD</option>
                            <option value="$">EUR</option>
                            <option value="$">MDL</option>
                        </select>
                    </div>
                    <button class="save-button">Save changes</button>
                </div>

            </div>
        </div>
    </div>




</body>

</html>
