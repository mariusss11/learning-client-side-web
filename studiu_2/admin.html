<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./adminStyle.css">
</head>

<body>

    <div class="head">
        <h1 class="page-title">Admin Panel</h1>
        <div class="buttons">
            <button class="add-button">Add product</button>
            <a href="home.html" class="back-button">Back to Home</a>
        </div>
    </div>

    <section class="products">
        <div class="all-cards">

            <div class="product-card">
                <div class="product-image">
                    <img src="images/product-1.png" alt="Beats Solo4" />
                </div>
                <div class="product-info">
                    <div class="product-name">Beats Solo4</div>
                    <div class="product-price">$225.50</div>
                    <div class="product-colors">
                        <div class="color-dot red"></div>
                        <div class="color-dot pink"></div>
                        <div class="color-dot green"></div>
                        <div class="color-dot cyan"></div>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="images/product-2.png" alt="JBL Tune 520BT" />
                </div>
                <div class="product-info">
                    <div class="product-name">JBL Tune 520BT</div>
                    <div class="product-price">$225.50</div>
                    <div class="product-colors">
                        <div class="color-dot red"></div>
                        <div class="color-dot cyan"></div>
                        <div class="color-dot green"></div>
                        <div class="color-dot gray"></div>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="images/product-3.png" alt="JLab Studio 2" />
                </div>
                <div class="product-info">
                    <div class="product-name">JLab Studio 2</div>
                    <div class="product-price">$225.50</div>
                    <div class="product-colors">
                        <div class="color-dot red"></div>
                        <div class="color-dot green"></div>
                        <div class="color-dot cyan"></div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
